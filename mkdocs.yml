site_name: RestMachine Documentation
site_description: A lightweight REST framework with dependency injection and webmachine-style state machine
site_author: Ryan Festag
site_url: https://rfestag.github.io/restmachine-python/

repo_name: rfestag/restmachine-python
repo_url: https://github.com/rfestag/restmachine-python
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025 Ryan Festag

theme:
  name: material
  logo: images/logo-header.svg  # Bold version for header
  favicon: images/favicon.ico
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - monorepo
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/restmachine/src, packages/restmachine-aws/src, packages/restmachine-web/src, packages/restmachine-orm/src, packages/restmachine-orm-dynamodb/src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            merge_init_into_class: true
            docstring_section_style: table
            members_order: source
            show_submodules: false

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rfestag/restmachine-python
  version:
    provider: mike

nav:
  - Home: index.md

  - Tutorial:
    - Setup & First Project: tutorial/01-setup.md
    - Creating Models: tutorial/02-models.md
    - Model Relationships: tutorial/03-relationships.md
    - Advanced HTTP Features: tutorial/04-advanced-http.md
    - Adding a Frontend: tutorial/05-frontend.md
    - Deployment: tutorial/06-deployment.md

  - Topics:
    - Authentication: guide/authentication.md
    - Content Negotiation: guide/content-negotiation.md
    - CORS: guide/cors.md
    - CSP (Security Policy): guide/csp.md
    - Deployment:
      - ASGI Servers: guide/deployment-asgi.md
      - Uvicorn: guide/deployment/uvicorn.md
      - Hypercorn: guide/deployment/hypercorn.md
      - AWS Lambda: guide/deployment-lambda.md
    - ETags (Conditional Requests): guide/etags.md
    - Headers (Multi-Value): advanced/headers.md
    - Lifecycle (Startup/Shutdown): advanced/lifecycle.md
    - Metrics & Observability: metrics.md
    - OpenAPI Generation: guide/openapi.md
    - Performance Optimization: advanced/performance.md
    - State Machine: advanced/state-machine.md
    - Templates: advanced/templates.md
    - Testing: guide/testing.md
    - TLS/mTLS: advanced/tls.md
    - Validation: guide/validation.md

  - Packages:
    - AWS (restmachine-aws): '!include ./packages/restmachine-aws/mkdocs.yml'
    - Web (restmachine-web): '!include ./packages/restmachine-web/mkdocs.yml'
    - ORM (restmachine-orm): '!include ./packages/restmachine-orm/mkdocs.yml'
    - ORM DynamoDB (restmachine-orm-dynamodb): '!include ./packages/restmachine-orm-dynamodb/mkdocs.yml'

  - API Reference:
    - Core:
      - Application: api/application.md
      - Request & Response: api/models.md
      - Router: api/router.md
      - State Machine: api/state-machine.md
    - ASGI Adapter: api/adapters.md
    - Dependencies: api/dependencies.md
    - Content Renderers: api/content-renderers.md
    - Error Models: api/error-models.md
    - Testing: api/testing.md

  - Development:
    - Contributing: development/contributing.md
    - Code Quality: development/code-quality.md
    - Security: development/security.md
    - Release Process: development/releases.md

  - About:
    - Changelog: about/changelog.md
    - License: about/license.md
