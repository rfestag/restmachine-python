<svg viewBox="45 40 110 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7da3d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5680b8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer hexagon glow -->
  <polygon points="100,50 143.301,75 143.301,125 100,150 56.699,125 56.699,75"
           stroke="url(#blueGray)" stroke-width="2.5" fill="none" opacity="0.3"/>

  <!-- Steel blue outline underneath main hexagon -->
  <polygon points="100,50 143.301,75 143.301,125 100,150 56.699,125 56.699,75"
           stroke="#3d5a80" stroke-width="7" fill="none" opacity="0.5"/>

  <!-- Main hexagon -->
  <polygon points="100,50 143.301,75 143.301,125 100,150 56.699,125 56.699,75"
           stroke="url(#blueGray)" stroke-width="5" fill="none"/>

  <!-- Connection lines from vertices to center -->
  <g stroke="url(#blueGray)" stroke-width="3" opacity="0.5">
    <line x1="100" y1="50" x2="100" y2="100"/>
    <line x1="143.301" y1="75" x2="100" y2="100"/>
    <line x1="143.301" y1="125" x2="100" y2="100"/>
    <line x1="100" y1="150" x2="100" y2="100"/>
    <line x1="56.699" y1="125" x2="100" y2="100"/>
    <line x1="56.699" y1="75" x2="100" y2="100"/>
  </g>

  <!-- Inner hexagon - filled - rotated -->
  <polygon points="112.99,100 106.495,110.897 93.505,110.897 87.01,100 93.505,89.103 106.495,89.103"
           fill="url(#blueGray)"/>

  <!-- Vertex state nodes -->
  <g>
    <circle cx="100" cy="50" r="6.5" fill="url(#blueGray)"/>
    <circle cx="100" cy="50" r="4" fill="#e8f0f7"/>

    <circle cx="143.301" cy="75" r="6.5" fill="url(#blueGray)"/>
    <circle cx="143.301" cy="75" r="4" fill="#e8f0f7"/>

    <circle cx="143.301" cy="125" r="6.5" fill="url(#blueGray)"/>
    <circle cx="143.301" cy="125" r="4" fill="#e8f0f7"/>

    <circle cx="100" cy="150" r="6.5" fill="url(#blueGray)"/>
    <circle cx="100" cy="150" r="4" fill="#e8f0f7"/>

    <circle cx="56.699" cy="125" r="6.5" fill="url(#blueGray)"/>
    <circle cx="56.699" cy="125" r="4" fill="#e8f0f7"/>

    <circle cx="56.699" cy="75" r="6.5" fill="url(#blueGray)"/>
    <circle cx="56.699" cy="75" r="4" fill="#e8f0f7"/>
  </g>

  <!-- Center hexagon - rotated -->
  <polygon points="109.093,100 104.547,107.813 95.453,107.813 90.907,100 95.453,92.187 104.547,92.187"
           fill="#e8f0f7" stroke="#e8f0f7" stroke-width="1"/>
</svg>
